<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Augustus Web</title>
<link rel="icon" type="image/png" href="static/augustus_256.png">
<style>
  /* Theme: the same as on the game's start page (shell.html). */
  @font-face { font-family: "Marcellus SC"; font-display: swap;
    src: url(static/MarcellusSC-Regular.ttf) format("truetype"); }
  :root {
    --display: "Marcellus SC", "Palatino Linotype", Palatino, Georgia, serif;
    --body: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --body-size: 15px;
    --backdrop: url(static/background.jpg);
    --shade: linear-gradient(to bottom, #0003 0%, #120a05a6 100%);
    /* Shown until the backdrop loads. */
    --landscape:
      radial-gradient(65% 25% at 50% 102%, #2c3822 0 60%, #0000 60.5%),
      radial-gradient(90% 36% at 15% 108%, #4a3e2a 0 60%, #0000 60.5%),
      radial-gradient(85% 30% at 85% 105%, #3b4d2c 0 60%, #0000 60.5%),
      radial-gradient(55% 40% at 75% 90%, #76634c 0 55%, #0000 55.5%),
      radial-gradient(40% 25% at 20% 86%, #82715c 0 55%, #0000 55.5%),
      linear-gradient(to bottom, #395c80 0%, #6f95b9 35%, #d8a873 70%, #bb6f3c 100%);
    --title: #fff4dc;
    --title-shadow: 0 2px 0 #3a1c0a, 0 0 5px #5c2408, 0 6px 18px #000d;
    --sub-shadow: 0 1px 0 #2e1405, 0 2px 8px #000e;
    --heading: #8b1e0f; --text: #2b1d11; --muted: #5e4630; --bad: #a81c1c;
    --accent: #8b1e0f;
    --text-shadow: 0 1px 0 #ffffffa6;
    --btn-fill: url(static/pattern.webp), #d8c4a0;
    --btn-hi: #fffaf0; --btn-lo: #755b39; --btn-outline: #4a3821;
    --btn-text: #2b1d11; --btn-off: #786958;
    --panel-fill: url(static/pattern.webp), #decbb0;
    --inset-fill: linear-gradient(#0000000d, #00000017), url(static/pattern.webp), #d8c5a4;
    --rim-in: #cbb692; --rim-out: #846842; --frame: #533e24;
    --bar-bg: #3a2b1c; --bar-fill: linear-gradient(#f5d162, #d4a935 50%, #b88a24);
    --canvas-rendering: pixelated;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 10vh 16px 32px; color: var(--text);
    font: var(--body-size)/1.5 var(--body);
    background: var(--shade), var(--backdrop) center bottom / cover, var(--landscape);
    background-attachment: fixed;
  }
  h1 {
    margin: 0 0 5vh; font: 400 clamp(40px, 8vw, 72px)/1 var(--display); color: var(--title);
    letter-spacing: .04em; text-align: center; text-shadow: var(--title-shadow);
  }
  form {
    width: min(380px, 100%); padding: 20px;
    background: var(--panel-fill);
    border: 3px solid var(--rim-in); outline: 3px solid var(--rim-out);
    box-shadow: 0 0 0 4px var(--frame), 0 10px 30px #000a;
  }
  label { display: block; margin-bottom: 14px; text-shadow: var(--text-shadow);
    font: 400 15px/1.3 var(--display);
    letter-spacing: .05em; color: var(--heading); }
  input {
    display: block; width: 100%; margin-top: 6px; padding: 9px 10px;
    font: 16px/1.2 var(--body); color: var(--text);
    background: var(--inset-fill); border: 0;
    box-shadow: inset 2px 2px 4px #0008, inset -1px -1px 0 #ffffff22;
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    width: 100%; margin-top: 4px; padding: 10px 16px; cursor: pointer;
    font: 400 20px/1.2 var(--display); letter-spacing: .05em; color: var(--accent);
    background: var(--btn-fill);
    border: 2px solid; border-color: var(--btn-hi) var(--btn-lo) var(--btn-lo) var(--btn-hi);
    outline: 1px solid var(--btn-outline); text-shadow: var(--text-shadow);
  }
  button:disabled { cursor: default; color: var(--btn-off); filter: saturate(.6); }
  #message { min-height: 1.5em; margin: 12px 0 0; text-align: center; color: var(--bad); }
</style>
</head>
<body>
<h1>Augustus Web</h1>
<form id="form" autocomplete="on">
  <label>Name
    <input id="username" name="username" autocomplete="username" autocapitalize="none"
           spellcheck="false" required autofocus>
  </label>
  <label>Password
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </label>
  <button id="submit">Enter</button>
  <p id="message" role="alert"></p>
</form>
<script>
'use strict';
const $ = id => document.getElementById(id);
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('submit').disabled = true;
  $('message').textContent = '';
  try {
    const r = await fetch('api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('username').value, password: $('password').value }),
    });
    if (r.ok) {
      location.replace('./');
      return;
    }
    const data = await r.json().catch(() => ({}));
    if (r.status === 429) {
      const minutes = Math.ceil((data.retry_after || 60) / 60);
      $('message').textContent = `Too many attempts. Try again in ${minutes} min.`;
    } else if (r.status === 401) {
      $('message').textContent = 'Wrong name or password.';
      $('password').value = '';
      $('password').focus();
    } else {
      $('message').textContent = 'Could not sign in. Try again.';
    }
  } catch (err) {
    $('message').textContent = 'The server cannot be reached.';
  }
  $('submit').disabled = false;
});
</script>
</body>
</html>
