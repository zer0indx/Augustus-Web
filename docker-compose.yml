# Self-hosted Augustus Web. Copy .env.example to .env, or set the variables in
# your stack manager.
# See web/README.md.

# Pinned so the saves volume (augustus_augustus-data) stays the same
# wherever the checkout lives; without it Compose derives the project name
# from the folder name.
name: augustus
services:
  augustus-web:
    # Built from this checkout; "docker compose up -d" rebuilds it when the
    # sources change. To deploy it through Portainer see deploy/portainer.py.
    image: augustus-web:latest
    build: .
    pull_policy: build
    container_name: augustus-web
    restart: unless-stopped
    ports:
      - "${AUGUSTUS_HTTP_PORT:-8080}:8080"
    environment:
      AUGUSTUS_USER: ${AUGUSTUS_USER:-caesar}
      AUGUSTUS_PASSWORD: ${AUGUSTUS_PASSWORD:?set AUGUSTUS_PASSWORD (at least 9 characters)}
      # "server": the game files come from the folder mounted at /game.
      # "local": every browser picks its own Caesar III folder.
      AUGUSTUS_GAME_SOURCE: ${AUGUSTUS_GAME_SOURCE:-server}
      AUGUSTUS_SESSION_DAYS: ${AUGUSTUS_SESSION_DAYS:-30}
      # 1: a reverse proxy is in front, the client address and https come
      # from its headers. 0: browsers reach the port directly.
      AUGUSTUS_TRUST_PROXY: ${AUGUSTUS_TRUST_PROXY:-0}
    volumes:
      # Saves, their older versions and the session secret: the augustus-data
      # volume, or the folder on the host that AUGUSTUS_DATA_PATH names.
      - ${AUGUSTUS_DATA_PATH:-augustus-data}:/data
      # Only read with AUGUSTUS_GAME_SOURCE=server: your Caesar III folder
      # (the one with c3.sg2, c3.eng).
      - ${AUGUSTUS_GAME_PATH:-./game}:/game:ro
    # The container runs as user 1000. With a host folder in AUGUSTUS_DATA_PATH
    # that this user cannot write to, set the folder's owner here
    # (e.g. "1026:100").
    # user: "1026:100"

volumes:
  augustus-data:
